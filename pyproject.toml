[project]
name = "sentinelai"
version = "0.1.0"
description = "A multimodal predictive maintenance platform."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "SentinelAI Team" }
]

dependencies = []


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
