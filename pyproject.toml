[project]
name = "sentinelai"
version = "0.1.0"
description = "A multimodal predictive maintenance platform."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "SentinelAI Team" }
]

dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "joblib>=1.5.3",
    "langgraph>=1.2.11",
    "librosa>=0.11.0",
    "numpy>=2.2,<2.5",
    "openai>=3.3.1",
    "pandas>=3.0.5",
    "pillow>=12.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.0",
    "sentence-transformers>=5.7.0",
    "soundfile>=0.13.1",
    "sqlalchemy>=2.0.52",
    "torch>=2.8.0,<3",
    "torchvision>=0.23.0,<1",
    "transformers>=4.57.0,<5",
    "uvicorn>=0.52.4",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
